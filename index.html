<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My To-Do List</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
    input { padding: 8px; width: 70%; }
    button { padding: 8px 12px; cursor: pointer; }
    li { margin: 8px 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    li.done span { text-decoration: line-through; color: gray; }
    .delete-btn { background: #e74c3c; color: white; border: none; border-radius: 4px; padding: 4px 8px; }
  </style>
</head>
<body>
  <h1>My To-Do List</h1>
  <input id="task" placeholder="Add a task">
  <button onclick="addTask()">Add</button>
  <ul id="list"></ul>

  <script>
    function addTask() {
      const input = document.getElementById("task");
      if (input.value.trim() === "") return;

      const li = document.createElement("li");

      const text = document.createElement("span");
      text.textContent = input.value;
      li.onclick = () => li.classList.toggle("done");

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "Delete";
      deleteBtn.className = "delete-btn";
      deleteBtn.onclick = (event) => {
        event.stopPropagation();
        li.remove();
      };

      li.appendChild(text);
      li.appendChild(deleteBtn);
      document.getElementById("list").appendChild(li);
      input.value = "";
    }
  </script>
</body>
</html>
